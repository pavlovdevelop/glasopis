[package]
name = "glasopis"
description = "Glasopis - Bulgarian voice typing for Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
default-run = "glasopis"

[lib]
name = "glasopis_lib"
crate-type = ["lib"]

[features]
# По подразбиране Glasopis разпознава речта през Groq и не носи whisper.cpp:
# инсталаторът е малък и компилацията не изисква C/C++ инструменти.
#
# `whisper` добавя локално разпознаване на този компютър (whisper.cpp). За него
# са нужни CMake и Visual Studio Build Tools - вижте docs/building.md.
default = []
whisper = ["dep:whisper-rs"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
glasopis-core = { path = "../crates/glasopis-core" }

anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

parking_lot = "0.12"
sha2 = "0.10"
cpal = "0.17"
# TLS through Windows Schannel (native-tls): no OpenSSL, no extra build
# tooling, and the system certificate store is used.
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "multipart",
  "json",
  "native-tls",
  "charset",
  "http2",
] }

tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
# default-tls features pull in rustls + ring, which needs a native MSVC
# toolchain to cross-check on Linux CI; native-tls (Schannel) matches the
# rest of the app and needs no extra build tooling.
tauri-plugin-updater = { version = "2", default-features = false, features = [
  "native-tls",
  "system-proxy",
  "zip",
] }

whisper-rs = { version = "0.16", optional = true }

[target.'cfg(windows)'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Diagnostics_Debug",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Media_Audio",
] }

[dev-dependencies]
tempfile = "3"
