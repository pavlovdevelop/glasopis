[workspace]
resolver = "2"
members = ["crates/glasopis-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Pavel Pavlov"]
repository = "https://github.com/pavlovdevelop/glasopis"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
