# Настройки за компилиране, валидни и локално, и в CI.
[env]
# whisper.cpp се компилира по подразбиране с инструкциите на машината, която
# го компилира (GGML_NATIVE=ON). Билд от сървър с AVX-512 се срива мълчаливо
# на процесор без тези инструкции — процесът просто изчезва по време на
# разпознаването, без съобщение и без ред в лога.
GGML_NATIVE = "OFF"

# Дори с NATIVE=OFF ggml по подразбиране включва AVX/AVX2/FMA/F16C. Има
# достатъчно разпространени процесори без тях (Celeron/Pentium от сериите N,
# Atom, по-стари машини), затова разпространяваният инсталатор се прави на
# базово ниво, което върви навсякъде. По-бавно е, но работи.
#
# За собствената си машина може да изтриете тези редове или да сложите
# GGML_NATIVE = "ON" — ще получите осезаемо по-бързо разпознаване.
GGML_AVX = "OFF"
GGML_AVX2 = "OFF"
GGML_AVX512 = "OFF"
GGML_FMA = "OFF"
GGML_F16C = "OFF"
