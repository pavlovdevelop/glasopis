# Настройки за компилиране, валидни и локално, и в CI.
[env]
# whisper.cpp се компилира по подразбиране с инструкциите на машината, която
# го компилира (GGML_NATIVE=ON). Така един билд, направен на сървър с AVX-512,
# се срива с "illegal instruction" на потребителски процесор, който няма тези
# инструкции — процесът просто изчезва, без съобщение.
#
# OFF връща преносимите настройки на ggml (AVX2/FMA/F16C, без AVX-512), които
# работят на практически всеки x86-64 процесор от 2013 г. насам. Разликата в
# скоростта е малка; надеждността на разпространявания инсталатор е по-важна.
#
# За лично ползване на собствената ви машина може да го върнете на "ON".
GGML_NATIVE = "OFF"
