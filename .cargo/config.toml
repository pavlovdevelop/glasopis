# Настройки за компилиране, валидни и локално, и в CI.
[env]
# whisper.cpp се компилира по подразбиране с инструкциите на машината, която
# го компилира (GGML_NATIVE=ON). Билд от сървър с AVX-512 се срива мълчаливо
# на процесор без тези инструкции — процесът просто изчезва по време на
# разпознаването, без съобщение и без ред в лога. Затова наборът инструкции
# се задава изрично тук, а не се наследява от машината.
GGML_NATIVE = "OFF"

# AVX2, FMA и F16C са налични на практически всеки x86-64 процесор от 2013 г.
# нататък (Intel от Haswell, AMD от Excavator/Zen) и дават няколкократно
# по-бързо разпознаване.
GGML_AVX = "ON"
GGML_AVX2 = "ON"
GGML_FMA = "ON"
GGML_F16C = "ON"

# AVX-512 остава изключено нарочно. Потребителските процесори на Intel от
# 12-то поколение нататък (Alder Lake, Raptor Lake) го нямат, а сървърите,
# които компилират, го имат — точно това разминаване чупеше приложението.
GGML_AVX512 = "OFF"
