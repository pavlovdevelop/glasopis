name: Release

on:
  push:
    tags: ["v*"]
    # Всеки push в main обновява GitHub Release "latest" с последния
    # инсталатор — постоянен линк, без да се разчита на Actions artifacts.
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build GlasopisSetup.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Compute the build version
        id: version
        shell: pwsh
        run: |
          # Версионирани тагове (v0.2.0) носят точно тази версия. Всеки push в
          # main получава 0.1.<run_number> — расте монотонно, за да може
          # updater-ът (сравнение по semver) винаги да разпознае "по-нова".
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = "0.1.${{ github.run_number }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set the version in tauri.conf.json
        shell: pwsh
        run: |
          $path = "src-tauri/tauri.conf.json"
          $content = Get-Content -Raw -Path $path
          $updated = $content -replace '"version": "0\.1\.0"', '"version": "${{ steps.version.outputs.version }}"'
          if ($updated -eq $content) { throw "version field not found/replaced in $path" }
          Set-Content -Path $path -Value $updated -NoNewline

      - name: Build the application and the installer
        # Задава двата GitHub secrets, за да подпише Tauri ъпдейт артефакта
        # (updater/latest.json подпис) — виж https://v2.tauri.app/plugin/updater/.
        # Това НЕ е Windows Authenticode сертификат: SmartScreen продължава
        # да показва предупреждение, защото такъв сертификат струва пари.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Rename the installer
        id: installer
        shell: pwsh
        run: |
          # Проектът е Cargo workspace, затова bundle излиза в target/ в корена.
          $installer = Get-ChildItem -Path target -Recurse -Filter *-setup.exe |
            Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item $installer.FullName artifacts/GlasopisSetup.exe
          Get-FileHash artifacts/GlasopisSetup.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  GlasopisSetup.exe" } |
            Out-File -Encoding ascii artifacts/GlasopisSetup.exe.sha256

          $sig = Get-ChildItem -Path target -Recurse -Filter "$($installer.Name).sig" |
            Select-Object -First 1
          "has_signature=$([bool]$sig)" >> $env:GITHUB_OUTPUT
          if ($sig) { Copy-Item $sig.FullName artifacts/GlasopisSetup.exe.sig }

      - name: Build the update manifest (latest.json)
        if: github.ref == 'refs/heads/main' && steps.installer.outputs.has_signature == 'True'
        shell: pwsh
        run: |
          $manifest = @{
            version   = "${{ steps.version.outputs.version }}"
            notes     = "Автоматична компилация от main (${{ github.sha }})."
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = (Get-Content -Raw artifacts/GlasopisSetup.exe.sig).Trim()
                url       = "https://github.com/pavlovdevelop/glasopis/releases/download/latest/GlasopisSetup.exe"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 artifacts/latest.json

      - name: Publish the versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true
          body: |
            **Говориш. То пише.**

            Изтеглете `GlasopisSetup.exe` по-долу. Инсталацията е за текущия потребител и не
            изисква администраторски права.

            Компилацията **не е подписана с цифров сертификат**, затова Windows SmartScreen може
            да покаже предупреждение — изберете „Повече информация → Изпълни въпреки това“.
            Контролната сума на файла е в `GlasopisSetup.exe.sha256`.

            ---

            This build is **not code-signed**; Windows SmartScreen may warn about it.
            Choose *More info → Run anyway*, or build from source.

      - name: Publish/update the rolling "latest" build from main
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последна компилация от main
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          draft: false
          # GitHub's /releases/latest (и от там /releases/latest/download/...)
          # сочи само към release, който НЕ е prerelease и НЕ е draft — затова
          # тук трябва да е false, иначе линкът "latest" води до 404.
          prerelease: false
          body: |
            Автоматична компилация от последния commit в `main` (${{ github.sha }}).
            Обновява се при всеки push — не е официално издание.

            Изтеглете `GlasopisSetup.exe` по-долу. Инсталацията е за текущия потребител и не
            изисква администраторски права.

            Компилацията **не е подписана с цифров сертификат**, затова Windows SmartScreen може
            да покаже предупреждение — изберете „Повече информация → Изпълни въпреки това“.
            Контролната сума на файла е в `GlasopisSetup.exe.sha256`.

            За официални версии виж [Releases с таг `v*`](../../releases).

            ---

            Automatic build from the latest commit on `main`. Updated on every push — not an
            official release. This build is **not code-signed**; Windows SmartScreen may warn
            about it. Choose *More info → Run anyway*, or build from source.
