name: Release

on:
  push:
    tags: ["v*"]
    # Всеки push в main обновява GitHub Release "latest" с последния
    # инсталатор — постоянен линк, без да се разчита на Actions artifacts.
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build GlasopisSetup.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - name: Build the application and the installer
        run: npm run tauri build

      - name: Rename the installer
        shell: pwsh
        run: |
          # Проектът е Cargo workspace, затова bundle излиза в target/ в корена.
          $installer = Get-ChildItem -Path target -Recurse -Filter *-setup.exe |
            Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item $installer.FullName artifacts/GlasopisSetup.exe
          Get-FileHash artifacts/GlasopisSetup.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  GlasopisSetup.exe" } |
            Out-File -Encoding ascii artifacts/GlasopisSetup.exe.sha256

      - name: Publish the versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true
          body: |
            **Говориш. То пише.**

            Изтеглете `GlasopisSetup.exe` по-долу. Инсталацията е за текущия потребител и не
            изисква администраторски права.

            Компилацията **не е подписана с цифров сертификат**, затова Windows SmartScreen може
            да покаже предупреждение — изберете „Повече информация → Изпълни въпреки това“.
            Контролната сума на файла е в `GlasopisSetup.exe.sha256`.

            ---

            This build is **not code-signed**; Windows SmartScreen may warn about it.
            Choose *More info → Run anyway*, or build from source.

      - name: Publish/update the rolling "latest" build from main
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последна компилация от main
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          draft: false
          prerelease: true
          body: |
            Автоматична компилация от последния commit в `main` (${{ github.sha }}).
            Обновява се при всеки push — не е официално издание.

            Изтеглете `GlasopisSetup.exe` по-долу. Инсталацията е за текущия потребител и не
            изисква администраторски права.

            Компилацията **не е подписана с цифров сертификат**, затова Windows SmartScreen може
            да покаже предупреждение — изберете „Повече информация → Изпълни въпреки това“.
            Контролната сума на файла е в `GlasopisSetup.exe.sha256`.

            За официални версии виж [Releases с таг `v*`](../../releases).

            ---

            Automatic build from the latest commit on `main`. Updated on every push — not an
            official release. This build is **not code-signed**; Windows SmartScreen may warn
            about it. Choose *More info → Run anyway*, or build from source.
